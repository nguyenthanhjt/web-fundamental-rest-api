version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: nestAuth
    environment:
      POSTGRES_USER: nestAuth
      POSTGRES_PASSWORD: nestAuth@123
      POSTGRES_DB: nest-auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
